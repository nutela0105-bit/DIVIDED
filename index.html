<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세계의 뒷면 — PART 1 : 프롤로그 & 멘지의 영역</title>
<style>
:root{--panel:rgba(14,22,40,.93);--edge:#7fb7ff;--ink:#eaf2ff;--gold:#ffd77a;--mute:#9fb2d4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04060b;overflow:hidden;font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:960px;height:640px;flex:none;transform-origin:center center;background:#000;overflow:hidden;user-select:none}
#view{position:absolute;left:0;top:0;width:960px;height:640px;image-rendering:pixelated}
.hidden{display:none!important}
.panel{background:var(--panel);border:3px solid var(--edge);border-radius:8px;box-shadow:0 0 0 2px #0a1224,0 6px 20px rgba(0,0,0,.5)}
#hud>*{position:absolute}
#hp{left:12px;top:12px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:14px}
#hp .lbl{color:#ff9c9c;font-weight:700}
.bar{width:150px;height:14px;background:#1a2438;border:2px solid #0a1224;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(#ff8a8a,#dd4444);transition:width .3s}
#btns{left:12px;top:60px;display:flex;gap:6px;flex-wrap:wrap;width:340px}
button{font-family:inherit}
.hb{background:var(--panel);color:var(--ink);border:2px solid var(--edge);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
.hb:hover{background:#243a64}
.hb kbd{background:#2b4170;border-radius:3px;padding:0 4px;font-size:11px;margin-left:2px}
#loc{left:50%;top:12px;transform:translateX(-50%);padding:5px 16px;font-size:14px;white-space:nowrap}
#quest{right:12px;top:12px;width:300px;padding:8px 12px;font-size:13px;line-height:1.5}
#quest h4{margin:0 0 3px;font-size:12px;color:var(--gold);letter-spacing:.5px}
#quest .mt{font-weight:700;font-size:14px}
#quest .ms{color:#cfe0ff}
#quest .sd{margin-top:5px;padding-top:5px;border-top:1px dashed #3b5385;font-size:12px;color:var(--mute)}
#toasts{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:20}
.toast{background:rgba(10,18,36,.92);border:2px solid var(--edge);border-radius:20px;padding:5px 16px;font-size:14px;animation:tin .25s,tout .5s 2.6s forwards;white-space:nowrap}
.toast.item{border-color:#7dffb0}.toast.quest{border-color:var(--gold);color:var(--gold)}.toast.done{border-color:#ff9fe0;color:#ffc9ef}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#prompt{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);padding:6px 18px;font-size:15px;white-space:nowrap;pointer-events:none}
#prompt b{background:#2b4170;border:1px solid var(--edge);border-radius:4px;padding:0 7px;margin-right:6px;color:var(--gold)}
#dialog{position:absolute;left:40px;right:40px;bottom:20px;min-height:148px;padding:16px 22px 14px;cursor:pointer;z-index:30}
#dName{position:absolute;left:18px;top:-17px;background:#2b4170;border:3px solid var(--edge);border-radius:6px;padding:2px 16px;font-size:16px;font-weight:700;color:var(--gold)}
#dText{font-size:20px;line-height:1.6;min-height:64px;white-space:pre-wrap;margin-top:4px}
#dText.nar{font-style:italic;color:#cfe3ff}
#dNext{position:absolute;right:18px;bottom:8px;font-size:13px;color:var(--gold);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#dChoices{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#dChoices button{text-align:left;background:#1d3059;color:var(--ink);border:2px solid var(--edge);border-radius:6px;padding:6px 14px;font-size:16px;cursor:pointer}
#dChoices button:hover{background:#2f4d8f}
#modal{position:absolute;inset:0;background:rgba(2,5,12,.72);display:flex;align-items:center;justify-content:center;z-index:40}
#mBox{width:780px;height:500px;padding:14px 18px;display:flex;flex-direction:column}
#mTabs{display:flex;gap:6px;margin-bottom:10px;align-items:center}
#mTabs button.tab{background:#17254a;color:var(--mute);border:2px solid #34507f;border-radius:6px;padding:5px 16px;font-size:14px;cursor:pointer}
#mTabs button.tab.on{background:#2b4170;color:#fff;border-color:var(--edge)}
#mClose{margin-left:auto;background:#5a2a3a;color:#fff;border:2px solid #ff9aa8;border-radius:6px;padding:5px 12px;cursor:pointer}
#mBody{flex:1;overflow:auto;font-size:14px;line-height:1.6}
.invWrap{display:flex;gap:16px;height:100%}
.grid{display:grid;grid-template-columns:repeat(5,64px);grid-auto-rows:64px;gap:6px;align-content:start}
.slot{background:#101a33;border:2px solid #2d4476;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center}
.slot.has{cursor:pointer;border-color:#4d73b8}.slot.sel{border-color:var(--gold);background:#1e2f5a}
.slot img{width:44px;height:44px;image-rendering:pixelated}
.slot span{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:700}
.info{flex:1;background:#101a33;border:2px solid #2d4476;border-radius:8px;padding:12px 16px}
.info h3{margin:0 0 6px;color:var(--gold)}
.info button{margin-top:10px;background:#2d7a4f;color:#fff;border:2px solid #7dffb0;border-radius:6px;padding:6px 18px;font-size:14px;cursor:pointer}
.qb{background:#101a33;border:2px solid #2d4476;border-radius:8px;padding:8px 14px;margin-bottom:8px}
.qb.main{border-color:var(--gold)}.qb h3{margin:0;font-size:15px}.qb.main h3{color:var(--gold)}
.qb.done{opacity:.6}.qb ul{margin:4px 0 0;padding-left:18px;list-style:none}.qb li.ok{color:#8fe6a8;text-decoration:line-through}.qb li.now{color:#fff}
.help td{padding:3px 14px 3px 0;vertical-align:top}.help kbd{background:#2b4170;border:1px solid var(--edge);border-radius:4px;padding:1px 7px}
#fade,#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:50;background:#000}
#flash{background:#fff;z-index:51}
#cards{position:absolute;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center;cursor:pointer}
#cardTxt{max-width:720px;text-align:center;font-size:24px;line-height:1.8;transition:opacity 1s;white-space:pre-wrap;color:#dce9ff}
#cardHint{position:absolute;bottom:26px;right:34px;color:#6f84ad;font-size:13px}
#banner{position:absolute;left:0;right:0;top:170px;text-align:center;z-index:25;pointer-events:none;animation:bn 3.6s forwards}
#banner small{display:block;font-size:16px;letter-spacing:6px;color:#aecbff}
#banner b{display:block;font-size:44px;text-shadow:0 0 16px #5fb0ff,0 3px 0 #000;margin-top:4px}
@keyframes bn{0%{opacity:0;transform:translateY(-10px)}15%,75%{opacity:1;transform:none}100%{opacity:0}}
#title{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#16396e 0,#0a1530 55%,#03050c 100%)}
#title .sub{letter-spacing:8px;color:#8fb8ff;font-size:15px}
#title h1{font-size:62px;margin:10px 0 4px;text-shadow:0 0 24px #4aa3ff,0 4px 0 #000}
#title .part{color:var(--gold);font-size:18px;margin-bottom:34px}
#title button{width:260px;margin:6px;background:#1d3059;color:#fff;border:3px solid var(--edge);border-radius:10px;padding:11px;font-size:19px;cursor:pointer}
#title button:hover{background:#2f4d8f}
#title button:disabled{opacity:.35;cursor:default}
#title .tip{margin-top:26px;color:#6f84ad;font-size:13px;text-align:center;line-height:1.7}
.bub{position:absolute;border-radius:50%;background:rgba(150,210,255,.25);border:1px solid rgba(190,230,255,.5);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-700px);opacity:0}}
#ending{position:absolute;inset:0;z-index:65;background:rgba(3,6,16,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#ending h2{font-size:46px;margin:0 0 6px;text-shadow:0 0 20px #5fb0ff}
#ending p{max-width:640px;line-height:1.9;color:#cfe0ff;font-size:17px}
#ending button{margin:6px;background:#1d3059;color:#fff;border:3px solid var(--edge);border-radius:10px;padding:10px 26px;font-size:17px;cursor:pointer}
#ending button:hover{background:#2f4d8f}
</style>
</head>
<body>
<div id="game">
  <canvas id="view" width="960" height="640"></canvas>

  <div id="hud" class="hidden">
    <div id="hp" class="panel"><span class="lbl">HP</span><div class="bar"><i id="hpFill"></i></div><b id="hpTxt">100/100</b></div>
    <div id="btns">
      <button class="hb" id="bInv">🎒 인벤토리 <kbd>I</kbd></button>
      <button class="hb" id="bQuest">📜 퀘스트 <kbd>Q</kbd></button>
      <button class="hb" id="bHelp">❔ 도움말 <kbd>H</kbd></button>
      <button class="hb" id="bSave">💾 저장</button>

    </div>
    <div id="loc" class="panel">📍 <span id="locTxt"></span></div>
    <div id="quest" class="panel"></div>
  </div>

  <div id="toasts"></div>
  <div id="prompt" class="panel hidden"></div>

  <div id="dialog" class="panel hidden">
    <div id="dName"></div>

    <div id="dChoices"></div>

  </div>

  <div id="modal" class="hidden">
    <div id="mBox" class="panel">
      <div id="mTabs">
        <button class="tab" data-tab="inv">🎒 인벤토리</button>
        <button class="tab" data-tab="quest">📜 퀘스트</button>

  <div id="banner" class="hidden"></div>

  <div id="ending" class="hidden"></div>

  <div id="title">
    <div class="sub">THE OTHER SIDE OF THE WORLD</div>
    <h1>세계의 뒷면</h1>
    <div class="part">PART 1 — 프롤로그 &amp; 멘지의 영역</div>
    <button id="tNew">새로 시작</button>
    <button id="tCont">이어하기</button>
    <div class="tip">이동 WASD / 방향키 · 상호작용 E · 인벤토리 I · 퀘스트 Q · 도움말 H<br>진행 상황은 자동 저장됩니다.</div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   세계의 뒷면 — PART 1 : 프롤로그 & 멘지의 영역
   ---------------------------------------------------------------------
   구성  1.유틸  2.사운드  3.입력  4.스프라이트(코드로 그린 픽셀아트)
         5.맵 엔진  6.상태·퀘스트·인벤토리·저장  7.UI  8.대화
         9.게임 루프·렌더  10.콘텐츠(PART 1)  11.시작
   확장  PART 2, 3 은 10번 섹션과 같은 형식으로
         DATA.addMap / addItem / addQuest / addDialog 만 추가하면 됩니다.
   ===================================================================== */

/* ============================ 1. 유틸 ============================ */
const TILE=16, VW=480, VH=320;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hash2(x,y,s=0){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul((s|0)+1,1274126177);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const PLAYER_NAME='이안';
const G={GRASS:0,PATH:1,WATER:2,SAND:3,STONE:4,BRIDGE:5,FOREST:6,DITCH:7,SHALLOW:8,SOIL:9,SEA:10,ROCK:11};

/* ============================ 2. 사운드 ============================ */
const SFX={ctx:null,on:true,
 init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}},
 tone(f,d,type='square',v=.05,when=0,slide=0){if(!this.on||!this.ctx)return;try{const c=this.ctx,t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);}catch(e){}},
 play(n){switch(n){
  case'blip':this.tone(500+Math.random()*90,.035,'square',.02);break;
  case'pick':this.tone(660,.08,'triangle',.07);this.tone(990,.14,'triangle',.07,.08);break;
  case'ok':[523,659,784,1046].forEach((f,i)=>this.tone(f,.2,'triangle',.07,i*.1));break;
  case'dig':this.tone(130,.13,'sawtooth',.08,0,-60);break;
  case'hurt':this.tone(200,.15,'sawtooth',.07,0,-100);break;
  case'open':this.tone(220,1.8,'sine',.08,0,600);break;
  case'splash':this.tone(420,.3,'sine',.05,0,300);break;}}
};

/* ============================ 3. 입력 ============================ */
/* e.code 를 사용하므로 한글 자판 상태에서도 WASD / E 가 동작합니다 */
const Input={keys:{},pressed:{},
 init(){
  addEventListener('keydown',e=>{const k=e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();if(!e.repeat)this.pressed[k]=true;this.keys[k]=true;SFX.init();});
  addEventListener('keyup',e=>{this.keys[e.code]=false;});
  addEventListener('blur',()=>{this.keys={};});
 },
 down(...ks){return ks.some(k=>this.keys[k]);},
 hit(...ks){return ks.some(k=>this.pressed[k]);},
 endFrame(){this.pressed={};}
};

/* ============================ 4. 스프라이트 ============================ */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g);return c;}
function R(g,c,x,y,w=1,h=1){g.fillStyle=c;g.fillRect(x,y,w,h);}
function disc(g,cx,cy,r,c){g.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y)+.5);g.fillRect(cx-w,cy+y,w*2,1);}}
function tri(g,cx,top,h,hw,c){g.fillStyle=c;for(let i=0;i<h;i++){const w=Math.max(1,Math.round(1+i*(hw*2-1)/Math.max(1,h-1)));g.fillRect(cx-Math.floor(w/2),top+i,w,1);}}

const Sprites={T:{},tree:{},obj:{},houses:{},chars:{},icons:{},
 init(){this.initTiles();this.initObjects();},
 initTiles(){
  const T=this.T;
  const speck=(g,base,cols,n,seed,tall)=>{R(g,base,0,0,16,16);const r=rng(seed);cols.forEach((c,ci)=>{for(let i=0;i<n;i++)R(g,c,r()*15|0,r()*14|0,1,(tall&&ci===0&&r()<.5)?2:1);});};
  T.grass=[0,1,2,3].map(v=>mk(16,16,g=>speck(g,'#5aab4b',['#4a9a3f','#74c35f'],9,11+v*13,true)));
  T.forest=[0,1,2,3].map(v=>mk(16,16,g=>speck(g,'#3e8447',['#2f7339','#58a55a'],9,31+v*17,true)));
  T.path=[0,1,2].map(v=>mk(16,16,g=>speck(g,'#cfa56f',['#b98f5a','#e2bd88'],8,51+v*7)));
  T.sand=[0,1].map(v=>mk(16,16,g=>speck(g,'#ecdca3',['#d9c78a','#f6ecc4'],7,71+v*5)));
  T.stone=[0,1].map(v=>mk(16,16,g=>{R(g,'#aab6cf',0,0,16,16);R(g,'#8f9cb8',0,0,16,1);R(g,'#8f9cb8',0,8,16,1);R(g,'#8f9cb8',v?4:9,0,1,8);R(g,'#8f9cb8',v?12:3,8,1,8);R(g,'#c9d4ea',1,1,4,1);R(g,'#c9d4ea',v?6:11,9,4,1);}));
  T.water=[0,1,2,3].map(f=>mk(16,16,g=>{R(g,'#3b8fd8',0,0,16,16);R(g,'#2f7cc2',0,12,16,4);for(const [y,o] of [[2,0],[7,6],[11,3]])R(g,'#7cc0f4',(o+f*4)%13,y,4,1);R(g,'#fff',(f*5+3)%15,(f*7+2)%14,1,1);}));
  T.shallow=[0,1,2,3].map(f=>mk(16,16,g=>{R(g,'#6cc4ee',0,0,16,16);R(g,'#58b2e0',0,13,16,3);for(const [y,o] of [[3,2],[9,8]])R(g,'#bfe9ff',(o+f*3)%12,y,4,1);R(g,'#fff',(f*4+5)%15,(f*3+9)%14,1,1);}));
  T.ditch=[0,1].map(v=>mk(16,16,g=>{R(g,'#8c6c47',0,0,16,16);R(g,'#6f5236',0,0,2,16);R(g,'#6f5236',14,0,2,16);R(g,'#a98862',3,0,10,16);const r=rng(91+v);for(let i=0;i<6;i++)R(g,'#7a5d3c',3+(r()*9|0),r()*15|0,2,1);R(g,'#c7ab86',4+(r()*7|0),r()*14|0,1,1);}));
  T.bridge=[mk(16,16,g=>{R(g,'#a97a4a',0,0,16,16);for(let y=0;y<16;y+=4)R(g,'#7f5632',0,y,16,1);R(g,'#c79a63',0,1,16,1);R(g,'#c79a63',0,9,16,1);R(g,'#4a2f18',1,2,1,1);R(g,'#4a2f18',14,10,1,1);})];
  T.soil=[0,1].map(v=>mk(16,16,g=>{R(g,'#7a5336',0,0,16,16);for(let y=2;y<16;y+=5)R(g,'#5f3f27',0,y,16,1);const r=rng(5+v);for(let i=0;i<4;i++){const x=2+(r()*11|0),y=1+(r()*4|0)*4;R(g,'#4fa845',x,y,1,2);R(g,'#7ad66b',x-1,y,1,1);R(g,'#7ad66b',x+1,y,1,1);}}));
  T.sea=[0,1,2].map(v=>mk(16,16,g=>speck(g,'#0b2347',['#10305e','#08193a'],7,211+v*3)));
  T.rock=[0,1,2].map(v=>mk(16,16,g=>{R(g,'#16213a',0,0,16,16);const r=rng(50+v);for(let i=0;i<5;i++)R(g,'#22345a',r()*12|0,r()*12|0,3+(r()*4|0),2+(r()*3|0));for(let i=0;i<4;i++)R(g,'#0f1830',r()*13|0,r()*13|0,2,2);R(g,'#2f4a7c',2+(r()*8|0),2,3,1);}));
 },
 /* ---- 캐릭터 ---- */
 charSheet(p){
  const key=JSON.stringify(p);if(this.chars[key])return this.chars[key];
  const sh={};
  for(const d of['down','up','left']){sh[d]=[0,1,2].map(f=>this.charFrame(p,d,f));}
  sh.right=sh.left.map(c=>mk(16,20,g=>{g.translate(16,0);g.scale(-1,1);g.drawImage(c,0,0);}));
  return this.chars[key]=sh;
 },
 charFrame(p,dir,fr){return mk(16,20,g=>{
  const side=dir==='left',ex=p.extra||[];
  const lL=fr===1?1:0,lR=fr===2?1:0;
  if(dir==='up'&&ex.includes('cape'))R(g,p.capeC,3,9,10,9);
  if(!side){R(g,p.bottom,5,14,3,4-lL);R(g,p.bottom,8,14,3,4-lR);R(g,p.shoe,5,18-lL,3,2);R(g,p.shoe,8,18-lR,3,2);}

  if(wet){for(let k=0;k<10;k++){const ph=(t*1.4+k/10)%1,a=(k/10)*Math.PI*2,x=24+Math.cos(a)*ph*14,y=10+(ph*ph*-1+ph)*40+Math.sin(a)*0;R(g,'rgba(210,240,255,'+(1-ph).toFixed(2)+')',x|0,(y+6)|0,2,2);}}
 },
 crystal(g,t){
  const p=.5+.5*Math.sin(t*2.2);
  g.globalAlpha=.25+.2*p;disc(g,8,14,10,'#6fe0ff');g.globalAlpha=1;
  tri(g,8,2,18,7,'#46b8e8');tri(g,8,2,18,3,'#9af0ff');R(g,'#fff',7,5,1,5);R(g,'#2b86c0',10,12,2,8);R(g,'#2b6a9a',3,19,10,3);
  R(g,'#3a8fb8',1,18,3,4);R(g,'#9af0ff',1,18,1,2);
 },
 pillar(g,t,o){
  R(g,'#1e2d4d',2,2,12,30);R(g,'#2b4170',2,2,3,30);R(g,'#16213a',12,2,2,30);R(g,'#34507f',0,0,16,4);R(g,'#16213a',0,28,16,4);
  const p=.45+.55*(.5+.5*Math.sin(t*2+o.x*.05));
  g.globalAlpha=p;R(g,'#6fe9ff',7,8,2,2);R(g,'#6fe9ff',5,12,6,1);R(g,'#6fe9ff',7,13,2,6);R(g,'#6fe9ff',5,20,6,1);g.globalAlpha=1;
 },
 seaweed(g,t,o){
  for(let i=0;i<4;i++){const s=Math.round(Math.sin(t*1.6+i*.8+o.x*.1)*(1+i*.5));R(g,i%2?'#1f8a5a':'#2fb577',5+s+i*2,23-i*6-0,2,7);}
  R(g,'#1f8a5a',3,22,2,2);R(g,'#1f8a5a',10,22,2,2);
 },
 smoke(g,t,x,y){for(let i=0;i<4;i++){const ph=(t*.5+i/4)%1;g.globalAlpha=.55*(1-ph);disc(g,Math.round(x+Math.sin(ph*5+i)*3+ph*4),Math.round(y-ph*22),2+Math.round(ph*2),'#e8eef8');}g.globalAlpha=1;},
 abyssDoor(g,t,open){
  R(g,'#1d2c4a',0,0,128,96);R(g,'#2b4170',0,0,128,14);R(g,'#3b568f',0,0,128,2);R(g,'#16213a',0,12,128,2);
  R(g,'#26395f',0,14,18,82);R(g,'#26395f',110,14,18,82);R(g,'#34507f',0,14,3,82);R(g,'#34507f',110,14,3,82);
  const gap=Math.floor(open*40),pulse=.5+.5*Math.sin(t*2);
  if(open>0){g.globalAlpha=Math.min(1,.5+open);R(g,'#e6fcff',64-gap,18,gap*2,78);g.globalAlpha=1;}
  R(g,'#1a2a4a',20,18,44-gap,78);R(g,'#1a2a4a',64+gap,18,44-gap,78);
  R(g,'#2b4170',20,18,2,78);R(g,'#2b4170',106,18,2,78);
  g.globalAlpha=.4+.6*pulse;
  for(const [dx,dir] of [[0,1],[1,-1]]){const bx=dx?64+gap:64-gap;
   for(let i=0;i<5;i++){const y=26+i*14;R(g,'#6fe9ff',bx+dir*8-(dx?0:8),y,8,1);R(g,'#6fe9ff',bx+dir*14-(dx?0:2),y,1,6);R(g,'#6fe9ff',bx+dir*20-(dx?0:8),y+5,8,1);}}
  R(g,'#bff6ff',63-gap,18,1,78);R(g,'#bff6ff',64+gap,18,1,78);g.globalAlpha=1;
  disc(g,64,10,6,'#16213a');g.globalAlpha=.5+.5*pulse;disc(g,64,10,4,'#6fe9ff');g.globalAlpha=1;
 },
 jelly(g,x,y,t,s){
  const p=.5+.5*Math.sin(t*2+x);
  g.globalAlpha=.18;disc(g,x,y,12*s,'#9af0ff');g.globalAlpha=.8;
  disc(g,x,y,5*s,'#8fd9ff');R(g,'#8fd9ff',x-5*s,y,10*s,2);R(g,'#e6fcff',x-2*s,y-3*s,2,1);
  for(let i=-2;i<=2;i++){const sw=Math.round(Math.sin(t*3+i)*1);R(g,'#6fc0ee',x+i*2*s+sw,y+2,1,(5+p*3)*s);}
  g.globalAlpha=1;
 }
};

<script>
/* ============================ 5. 맵 엔진 ============================ */
class GameMap{
 constructor(id,w,h,o){this.id=id;this.w=w;this.h=h;this.name=o.name||'';this.theme=o.theme||'village';
  this.ground=new Uint8Array(w*h);this.solid=new Uint8Array(w*h);this.walls=[];
  this.objs=[];this.npcs=[];this.pickups=[];this.acts=[];this.triggers=[];this.hazards=[];this.glows=[];this.regen=[];this.critters=[];this.keep=new Set();this.doorOpen=0;}
 inb(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h;}
 get(x,y){return this.inb(x,y)?this.ground[y*this.w+x]:255;}
 set(x,y,v){if(this.inb(x,y))this.ground[y*this.w+x]=v;}
 fill(x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)this.set(i,j,v);}
 ellipse(cx,cy,rx,ry,v){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,v);}}
 brush(x0,y0,x1,y1,r,v,wide){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2||1;
  for(let i=0;i<=n;i++){const x=Math.round(lerp(x0,x1,i/n)),y=Math.round(lerp(y0,y1,i/n));
   for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)this.set(x+dx,y+dy,v);if(wide){this.set(x+1,y,v);this.set(x,y+1,v);}}}
 poly(pts,r,v,wide){for(let i=0;i<pts.length-1;i++)this.brush(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],r,v,wide);}
 blockRect(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(this.inb(i,j))this.solid[j*this.w+i]=1;}
 addObj(o){this.objs.push(o);if(o.solid)o.solid.forEach(r=>this.blockRect(r.x,r.y,r.w,r.h));return o;}
 removeObj(o){const i=this.objs.indexOf(o);if(i>=0)this.objs.splice(i,1);this.rebuildSolid();}
 rebuildSolid(){this.solid.fill(0);for(let i=0;i<this.ground.length;i++){const g=this.ground[i];if(g===G.WATER||g===G.ROCK)this.solid[i]=1;}
  for(const o of this.objs)if(o.solid)for(const r of o.solid)this.blockRect(r.x,r.y,r.w,r.h);for(const r of this.walls)this.blockRect(r.x,r.y,r.w,r.h);}
 isSolid(x,y){return!this.inb(x,y)||this.solid[y*this.w+x]===1;}
 free(tx,ty){for(let r=0;r<8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=tx+dx,y=ty+dy;if(this.inb(x,y)&&!this.isSolid(x,y)){const g=this.get(x,y);if(g!==G.WATER&&g!==G.ROCK)return[x,y];}}return[tx,ty];}
 keepAround(tx,ty,r=1){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)this.keep.add((tx+dx)+','+(ty+dy));}
}

/* ---- 맵 빌더 헬퍼 ---- */
const World={
 tree(m,tx,ty,kind='oak'){return m.addObj({x:tx*16-8,y:(ty+1)*16-40,w:32,h:40,sortY:(ty+1)*16,spr:Sprites.tree[kind],solid:[{x:tx,y:ty,w:1,h:1}],kind});},
 obj(m,tx,ty,spr,o={}){const w=spr.width,h=spr.height;return m.addObj(Object.assign({x:tx*16,y:(ty+1)*16-h,w,h,sortY:(ty+1)*16,spr,solid:o.solid===undefined?[{x:tx,y:ty,w:1,h:1}]:o.solid},o));},
 house(m,tx,ty,w,h,o){const spr=Sprites.house(w,h,o);const ob={x:tx*16,y:ty*16,w:w*16,h:h*16,sortY:(ty+h)*16,spr,solid:[{x:tx,y:ty,w,h}],windows:spr.windows};
  if(o.smoke)ob.draw=(g,t)=>{g.drawImage(spr,0,0);Dyn.smoke(g,t,w*16-12,2);};return m.addObj(ob);},
 /* 나무/덤불을 자동으로 흩뿌린다(길·건물·핵심 지점은 피함) */
 scatter(m,seed,cfg){
  const r=rng(seed),grid=new Uint8Array(m.w*m.h);
  const near=(x,y,rad,ids)=>{for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++)if(ids.includes(m.get(x+dx,y+dy)))return true;return false;};
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){
   const g=m.get(x,y);if(m.isSolid(x,y)||m.keep.has(x+','+y))continue;
   let dens=0,kinds;
   if(g===G.FOREST){dens=cfg.forest;kinds=['oak','oak','pine','pine','blue'];}
   else if(g===G.GRASS){dens=cfg.grass;kinds=['oak','oak','pine'];}
   if(!dens||r()>dens)continue;
   if(near(x,y,1,[G.PATH,G.STONE,G.DITCH,G.SHALLOW,G.SOIL,G.BRIDGE,G.WATER,G.SAND]))continue;
   let crowd=false;for(let dy=-1;dy<=1&&!crowd;dy++)for(let dx=-1;dx<=1;dx++)if(grid[(y+dy)*m.w+x+dx]){crowd=true;break;}
   if(crowd)continue;
   grid[y*m.w+x]=1;World.tree(m,x,y,kinds[(r()*kinds.length)|0]);
  }
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){const g=m.get(x,y);if(g!==G.GRASS||m.isSolid(x,y)||m.keep.has(x+','+y))continue;if(r()<cfg.bush&&!near(x,y,1,[G.PATH,G.STONE,G.DITCH,G.SHALLOW,G.SOIL,G.WATER,G.SAND])){World.obj(m,x,y,Sprites.obj.bush,{solid:[{x,y,w:1,h:1}]});}}
 }
};

/* ============================ 6. 상태·퀘스트·인벤토리·저장 ============================ */
const DATA={maps:{},items:{},quests:{},dialogs:{},order:{items:[],quests:[]},
 addMap(id,fn){this.maps[id]=fn;},addItem(id,o){this.items[id]=o;this.order.items.push(id);},
 addQuest(id,o){this.quests[id]=o;this.order.quests.push(id);},addDialog(id,fn){this.dialogs[id]=fn;}};
function newState(){return{map:'mariana',x:0,y:0,dir:'up',hp:100,maxHp:100,flags:{},quests:{},inv:{},outfit:'diver',trust:0,dusk:0};}
const S=newState();
function resetState(){for(const k of Object.keys(S))delete S[k];Object.assign(S,newState());}

const Inv={
 count(id){return S.inv[id]||0;},has(id,n=1){return this.count(id)>=n;},
 add(id,n=1,silent){S.inv[id]=this.count(id)+n;if(!silent){UI.toast(`획득: ${DATA.items[id].name}${n>1?' ×'+n:''}`,'item');SFX.play('pick');}UI.refreshPanel();Hooks.item();},
 remove(id,n=1){S.inv[id]=Math.max(0,this.count(id)-n);if(!S.inv[id])delete S.inv[id];UI.refreshPanel();}
};
const Hooks={item(){if(typeof checkQuestItems==='function')checkQuestItems();}};
const flag=k=>!!S.flags[k];const setf=(k,v=true)=>{S.flags[k]=v;};
const has=(id,n=1)=>Inv.has(id,n);const give=(id,n=1,s)=>Inv.add(id,n,s);const take=(id,n=1)=>Inv.remove(id,n);

const Q={
 start(id){if(S.quests[id])return false;S.quests[id]={stage:0,done:false};UI.toast('퀘스트 시작: '+DATA.quests[id].title,'quest');SFX.play('ok');UI.refreshQuest();Hooks.item();return true;},
 stage(id){const q=S.quests[id];return q?(q.done?999:q.stage):-1;},
 active(id){const q=S.quests[id];return!!q&&!q.done;},
 done(id){return!!(S.quests[id]&&S.quests[id].done);},
 advance(id,to){const q=S.quests[id];if(!q||q.done)return;const d=DATA.quests[id];if(to===undefined)to=q.stage+1;if(to<=q.stage)return;q.stage=to;
  if(to>=d.stages.length){this.complete(id);return;}
  UI.toast('퀘스트 갱신: '+Q.text(id),'quest');UI.refreshQuest();Save.auto();},
 complete(id){const q=S.quests[id];if(!q||q.done)return;q.done=true;const d=DATA.quests[id];UI.toast('퀘스트 완료: '+d.title,'done');SFX.play('ok');if(d.onComplete)d.onComplete();UI.refreshQuest();Save.auto();},
 text(id,i){const d=DATA.quests[id],q=S.quests[id];const s=d.stages[i===undefined?q.stage:i];return typeof s.text==='function'?s.text():s.text;}
};
function addTrust(n=1){S.trust=Math.min(6,S.trust+n);UI.refreshQuest();}

const Save={key:'backside_world_part1_v1',
 has(){try{return!!localStorage.getItem(this.key);}catch(e){return false;}},
 write(){if(Game.cut||!Game.started||!Game.map)return false;try{const o=JSON.parse(JSON.stringify(S));o.map=Game.map.id;o.x=Game.player.x;o.y=Game.player.y;o.dir=Game.player.dir;localStorage.setItem(this.key,JSON.stringify(o));return true;}catch(e){return false;}},
 auto(){this.write();},
 read(){try{return JSON.parse(localStorage.getItem(this.key));}catch(e){return null;}},
 clear(){try{localStorage.removeItem(this.key);}catch(e){}}
};

const UI={panelOpen:false,tab:'inv',sel:null,cardHandler:null,cardT:0,

  });
  $('dialog').onclick=e=>{if(e.target.closest('button'))return;Dlg.advance();};
  $('cards').onclick=()=>this.cardAdvance();
 },
 showHUD(v){$('hud').classList.toggle('hidden',!v);},
 setHP(){const pct=clamp(S.hp/S.maxHp*100,0,100);$('hpFill').style.width=pct+'%';$('hpTxt').textContent=Math.ceil(S.hp)+'/'+S.maxHp;},
 setLoc(n){$('locTxt').textContent=n;},
 toast(msg,cls='info'){const el=document.createElement('div');el.className='toast '+cls;el.textContent=msg;const box=$('toasts');box.appendChild(el);while(box.children.length>4)box.firstChild.remove();setTimeout(()=>el.remove(),3200);},
 prompt(txt){const p=$('prompt');if(txt){p.innerHTML='<b>E</b>'+txt;p.classList.remove('hidden');}else p.classList.add('hidden');},
 banner(sub,title){const b=$('banner');b.classList.add('hidden');void b.offsetWidth;b.innerHTML=`<small>${sub}</small><b>${title}</b>`;b.classList.remove('hidden');setTimeout(()=>b.classList.add('hidden'),3700);},
 refreshQuest(){
  const el=$('quest');let h='';
  const mainId=DATA.order.quests.find(id=>DATA.quests[id].type==='main'&&Q.active(id));
  if(mainId){h+=`<h4>메인 퀘스트</h4><div class="mt">${DATA.quests[mainId].title}</div><div class="ms">▸ ${Q.text(mainId)}</div>`;}
  else if(flag('epilogue_done')){h+=`<h4>PART 1 완료</h4><div class="ms">마을을 자유롭게 탐험하며<br>남은 부탁을 들어주자.</div>`;}
  const sides=DATA.order.quests.filter(id=>DATA.quests[id].type==='side'&&Q.active(id));
  if(sides.length)h+=`<div class="sd">`+sides.map(id=>`• <b>${DATA.quests[id].title}</b><br>&nbsp;&nbsp;${Q.text(id)}`).join('<br>')+`</div>`;
  h+=`<div class="sd">마을 신뢰도 ${'♥'.repeat(S.trust)}${'♡'.repeat(6-S.trust)}</div>`;
  el.innerHTML=h;if(this.panelOpen&&this.tab==='quest')this.renderPanel();
 },
 openPanel(tab){this.tab=tab;this.panelOpen=true;$('modal').classList.remove('hidden');this.renderPanel();},
 closePanel(){this.panelOpen=false;$('modal').classList.add('hidden');},
 refreshPanel(){if(this.panelOpen)this.renderPanel();},
 renderPanel(){
  document.querySelectorAll('#mTabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===this.tab));
  const body=$('mBody');
  if(this.tab==='inv'){
   const ids=DATA.order.items.filter(id=>Inv.count(id)>0);if(!ids.includes(this.sel))this.sel=ids[0]||null;
   let slots='';for(let i=0;i<20;i++){const id=ids[i];slots+=id?`<div class="slot has ${id===this.sel?'sel':''}" data-id="${id}"><img src="${Sprites.icon(id).toDataURL()}"><span>${Inv.count(id)>1?'×'+Inv.count(id):''}</span></div>`:`<div class="slot"></div>`;}
   let info='<div class="info"><h3>가방이 비어 있다</h3><p style="color:#9fb2d4">마을을 돌아다니며 아이템을 모아 보자.</p></div>';
   if(this.sel){const d=DATA.items[this.sel];info=`<div class="info"><h3>${d.name}</h3><p>${d.desc}</p>${d.use?`<button data-use="${this.sel}">사용하기</button>`:`<p style="color:#9fb2d4">${d.key?'중요한 물건':'소중히 간직하자'}</p>`}</div>`;}
   body.innerHTML=`<div class="invWrap"><div class="grid">${slots}</div>${info}</div>`;
  }else if(this.tab==='quest'){
   let h=`<div style="margin-bottom:8px;color:#ffd77a">마을 신뢰도: ${'♥'.repeat(S.trust)}${'♡'.repeat(6-S.trust)}</div>`,any=false;
   for(const id of DATA.order.quests){const q=S.quests[id];if(!q)continue;any=true;const d=DATA.quests[id];
    h+=`<div class="qb ${d.type==='main'?'main':''} ${q.done?'done':''}"><h3>${d.type==='main'?'★ ':'· '}${d.title}${q.done?' (완료)':''}</h3><div style="color:#9fb2d4;font-size:13px">${d.desc}</div><ul>`;
    d.stages.forEach((s,i)=>{if(i>q.stage&&!q.done)return;const ok=q.done||i<q.stage;h+=`<li class="${ok?'ok':'now'}">${ok?'✔':'▸'} ${Q.text(id,i)}</li>`;});h+='</ul></div>';}
   body.innerHTML=any?h:h+'<p>아직 받은 퀘스트가 없다.</p>';
  }else{
   body.innerHTML=`<table class="help"><tr><td><kbd>W A S D</kbd> / <kbd>방향키</kbd></td><td>이동 (바라보는 방향이 바뀝니다)</td></tr>
   <tr><td><kbd>E</kbd> / <kbd>Space</kbd></td><td>대화 · 조사 · 대사 넘기기 (선택지는 숫자 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 또는 클릭)</td></tr>
   <tr><td><kbd>I</kbd></td><td>인벤토리 (아이템 선택 후 '사용하기')</td></tr><tr><td><kbd>Q</kbd></td><td>퀘스트 목록</td></tr>
   <tr><td><kbd>H</kbd></td><td>이 도움말</td></tr><tr><td><kbd>M</kbd></td><td>소리 켜기/끄기</td></tr><tr><td><kbd>Esc</kbd></td><td>창 닫기</td></tr></table>
   <p style="margin-top:12px">· NPC나 반짝이는 물건 가까이 가면 화면 아래에 <b>E</b> 안내가 나타납니다.<br>· 바닥에서 반짝이는 아이템은 가까이 다가가면 자동으로 줍습니다.<br>· 가시덤불은 체력을 깎습니다. 푸른 수정 근처에서는 체력이 천천히 회복됩니다.<br>· 진행 상황은 주요 순간마다 자동 저장되며, 💾 버튼으로 직접 저장할 수도 있습니다.</p>`;
  }
 },
 fade(to,ms=800,color='#000'){const f=$('fade');f.style.background=color;f.style.transition=`opacity ${ms}ms`;void f.offsetWidth;f.style.opacity=to;return sleep(ms);},

async function digMud(m){
 if(!has('shovel')){await note(['진흙과 굵은 나뭇가지가 수로를 완전히 틀어막고 있다. 위쪽에는 물이 고여 찰랑거린다.','맨손으로는 어림도 없다. 도구가 필요하다.']);if(Q.stage('main1')===2)Q.advance('main1',3);return;}
 S.flags.dig=(S.flags.dig||0)+1;SFX.play('dig');Game.shakeNow(.25);
 if(S.flags.dig===1)await note(['삽 끝을 진흙 속에 꽂아 넣었다. 생각보다 단단하다. 몇 번이고 파내야겠다.']);
 else UI.toast(`퍽! 진흙을 파냈다 (${S.flags.dig}/3)`,'info');
 if(S.flags.dig<3)return;
 setf('channel_fixed');m.removeObj(m.mud);SFX.play('splash');Game.shakeNow(.7);
 Q.advance('main1',5);
 await note(['마지막 한 삽을 떠내자, 굵은 가지가 우두둑 소리를 내며 굴러떨어졌다.','막혀 있던 물이 콸콸 쏟아져 나온다 — 수로를 따라 마을 쪽으로 물이 흘러가기 시작했다!']);
 for(const [x,y] of m.ditchList){if(Game.map!==m)break;m.set(x,y,G.SHALLOW);if((x+y)%3===0)SFX.play('splash');await sleep(260);}
 setf('fountain_wet');addTrust(1);Save.auto();
}

/* ============================ 11. 시작 ============================ */
function fit(){const s=Math.min(innerWidth/960,innerHeight/640);$('game').style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();

async function startNewGame(){
 SFX.init();Save.clear();resetState();$('title').classList.add('hidden');
 Game.started=true;Game.cut=true;
 Game.loadMap('mariana',15*16+8,55*16+8,'up');
 UI.showHUD(false);
 await UI.fade(1,0);
 await UI.cards(['깊이 10,994미터. 마리아나 해구.','나는 그저 해양 탐사선에서 장비를 나르던 평범한 보조 요원이었다.\n그날도 평소와 다를 것 없는 하루였다.','소형 잠수정이 이상한 소리를 내며 흔들리기 전까지는.','통신이 끊기고, 눈앞이 캄캄해졌다.\n정신을 차렸을 때, 나는 잠수정 밖의 어둠 속에 떠 있었다.','이상하게도 숨이 막히지 않았다.\n그리고 아주 먼 곳에서, 희미한 빛이 일렁이고 있었다.']);
 Q.start('prologue');UI.showHUD(true);
 await UI.fade(0,1800);
 UI.banner('프롤로그','바닷속의 문');
 await Dlg.say('',[nar('(WASD 또는 방향키로 헤엄쳐서, 먼 곳의 푸른 빛을 향해 나아가자.)')]);
 Game.cut=false;
}
function continueGame(){
 SFX.init();const o=Save.read();if(!o)return;
 resetState();Object.assign(S,newState(),o);$('title').classList.add('hidden');
 Game.started=true;Game.cut=false;
 Game.loadMap(S.map,S.x,S.y,S.dir||'down');UI.showHUD(true);UI.setHP();UI.refreshQuest();
 UI.toast('저장된 게임을 불러왔습니다.','info');
}

Sprites.init();Input.init();UI.init();Game.init();
$('tNew').onclick=startNewGame;
$('tCont').onclick=continueGame;$('tCont').disabled=!Save.has();
/* 타이틀 배경 기포 */
(()=>{const t=$('title'),r=rng(5);for(let i=0;i<26;i++){const b=document.createElement('div');b.className='bub';const s=4+r()*14;b.style.cssText=`width:${s}px;height:${s}px;left:${r()*960}px;top:${380+r()*260}px;animation-duration:${6+r()*9}s;animation-delay:${-r()*10}s`;t.appendChild(b);}})();

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{if(Game.started&&Game.map){Game.update(dt);Game.draw();}}catch(e){console.error(e);}Input.endFrame();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
/* 디버깅/확장용 */
window.__game={Game,S,Q,Inv,DATA,UI,Dlg,startNewGame};
</script>
